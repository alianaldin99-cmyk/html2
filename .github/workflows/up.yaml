
name: up

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'رابط الملف (mp4 أو mkv أو أي صيغة)'
        required: true
        type: string

      duration_minutes:
        description: 'مدة الملف بالدقائق (للتوضيح فقط، 5–360)'
        required: true
        default: '10'
        type: string

      title:
        description: 'عنوان الفيديو'
        required: false
        default: 'تسجيل فيديو'
        type: string

permissions:
  contents: read

concurrency:
  group: vod-upload
  cancel-in-progress: false

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: تثبيت الأدوات
        run: |
          python -m pip install --upgrade internetarchive

      - name: تنزيل الفيديو
        env:
          FILE_URL: ${{ inputs.file_url }}
        run: |
          set -euo pipefail

          EXT=$(python -c '
          import os
          from urllib.parse import urlparse
          ext = os.path.splitext(urlparse(os.environ["FILE_URL"]).path)[1]
          if not ext or len(ext) > 10:
              ext = ".mp4"
          print(ext.lower())
          ')

          OUTPUT="video_$(date -u +%Y%m%d_%H%M%S)_${GITHUB_RUN_ID}${EXT}"

          echo "بدء تنزيل الفيديو..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            -o "$OUTPUT" \
            "$FILE_URL"

          if [ ! -s "$OUTPUT" ]; then
            echo "فشل التنزيل أو أن الملف فارغ"
            exit 1
          fi

          echo "OUTPUT_FILE=$OUTPUT" >> "$GITHUB_ENV"
          echo "SIZE_MB=$(du -m "$OUTPUT" | cut -f1)" >> "$GITHUB_ENV"

          echo "تم التنزيل بنجاح"
          ls -lh "$OUTPUT"

      - name: رفع الفيديو إلى الصفحة الموحدة
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          VIDEO_TITLE: ${{ inputs.title }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from internetarchive import upload, modify_metadata

          # معرّف ثابت واحد لجميع الفيديوهات
          IDENTIFIER = "my-vod-library-2026"

          access_key = os.environ["S3_ACCESS_KEY"]
          secret_key = os.environ["S3_SECRET_KEY"]
          file_path = Path(os.environ["OUTPUT_FILE"])
          title = os.environ.get("VIDEO_TITLE", "").strip() or "تسجيل فيديو"

          if not access_key or not secret_key:
              sys.exit("خطأ: تحقق من GitHub Secrets")

          if not file_path.is_file() or file_path.stat().st_size == 0:
              sys.exit("خطأ: ملف الفيديو غير موجود أو فارغ")

          # اسم فريد لكل رفع، لتجنب استبدال الملفات السابقة
          timestamp = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          ext = file_path.suffix or ".mp4"
          remote_name = f"video_{timestamp}_{run_id}{ext}"

          # بيانات الصفحة الثابتة
          metadata = {
              "title": "مكتبة تسجيلات الفيديو",
              "description": "مكتبة تجمع ملفات الفيديو المرفوعة تلقائياً.",
              "mediatype": "movies",
              "collection": "opensource_movies",
              "subject": ["video", "recording", "vod"]
          }

          print(f"معرّف الصفحة: {IDENTIFIER}")
          print(f"عنوان الفيديو: {title}")
          print(f"اسم الملف: {remote_name}")
          print("بدء الرفع...")

          responses = upload(
              IDENTIFIER,
              files={remote_name: str(file_path)},
              metadata=metadata,
              access_key=access_key,
              secret_key=secret_key,
              retries=10,
              retries_sleep=10,
              verify=True
          )

          if not responses or not all(
              r.status_code in (200, 201, 202) for r in responses
          ):
              for r in responses or []:
                  print("Upload error:", r.status_code, r.text[:500])
              sys.exit("فشل رفع الفيديو")

          # إضافة عنوان خاص بالملف دون تغيير عنوان الصفحة الرئيسية
          result = modify_metadata(
              IDENTIFIER,
              {"title": title},
              target=f"files/{remote_name}",
              access_key=access_key,
              secret_key=secret_key
          )

          if result.status_code not in (200, 201, 202):
              print("تحذير: رُفع الفيديو، لكن تعذر تحديث عنوان الملف.")
              print(result.status_code, result.text[:500])

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"IA_IDENTIFIER={IDENTIFIER}\n")
              f.write(f"REMOTE_NAME={remote_name}\n")

          print("تم رفع الفيديو بنجاح.")
          print(f"الصفحة: https://archive.org/details/{IDENTIFIER}")
          print(f"الفيديو: https://archive.org/download/{IDENTIFIER}/{remote_name}")
          PY

      - name: عرض النتيجة النهائية
        if: always()
        env:
          IA_IDENTIFIER: ${{ env.IA_IDENTIFIER }}
          REMOTE_NAME: ${{ env.REMOTE_NAME }}
          SIZE_MB: ${{ env.SIZE_MB }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "=========================================="
          echo "حالة العملية: $JOB_STATUS"
          echo "حجم الملف: ${SIZE_MB:-غير متاح} MB"

          if [ -n "${IA_IDENTIFIER:-}" ]; then
            echo "الصفحة الموحدة:"
            echo "https://archive.org/details/$IA_IDENTIFIER"
          fi

          if [ -n "${REMOTE_NAME:-}" ] && [ -n "${IA_IDENTIFIER:-}" ]; then
            echo "رابط تنزيل الفيديو:"
            echo "https://archive.org/download/$IA_IDENTIFIER/$REMOTE_NAME"
          fi

          echo "=========================================="
