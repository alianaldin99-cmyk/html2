name: vod

on:
  workflow_dispatch:
    inputs:
      m3u8_url:
        description: 'رابط الملف'
        required: true
      duration_minutes:
        description: 'مدة التسجيل بالدقايق (5–360 دقيقة)'
        required: true
        default: '10'
      title:
        description: 'عنوان التسجيل (اختياري)'
        required: false
        default: 'تسجيل بث مباشر'

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: تثبيت الأدوات اللازمة
        run: |
          pip install internetarchive

      - name: تنزيل الملف
        run: |
          OUTPUT="record_$(date +%Y%m%d_%H%M%S).mp4"

          curl -L -o "\( OUTPUT" " \){{ inputs.m3u8_url }}"

          if [ ! -s "$OUTPUT" ]; then
            echo "فشل التنزيل (حجم الملف صفر)"
            exit 1
          fi

          echo "output_file=$OUTPUT" >> $GITHUB_ENV
          echo "size_mb=$(du -m "$OUTPUT" | cut -f1)" >> $GITHUB_ENV

      - name: رفع إلى Internet Archive
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          python - <<EOF
          from internetarchive import upload
          import os
          from datetime import date

          identifier = "record-\( (date +%Y%m%d-%H%M%S)- \){GITHUB_RUN_ID}"
          file_path = "${{ env.output_file }}"

          title = "${{ inputs.title }}" or "تسجيل m3u8 تلقائي - $(date +%Y-%m-%d)"

          metadata = {
              'title': title,
              'description': f'تنزيل ملف عادي ثم رفعه',