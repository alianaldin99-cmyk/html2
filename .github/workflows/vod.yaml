name: vod

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'رابط الملف (mp4 أو mkv أو أي صيغة)'
        required: true
      duration_minutes:
        description: 'مدة التسجيل بالدقايق (5–360 دقيقة)'
        required: true
        default: '10'
      title:
        description: 'عنوان التسجيل (اختياري)'
        required: false
        default: 'تسجيل بث مباشر'

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: تثبيت الأدوات اللازمة
        run: |
          pip install internetarchive

      - name: تنزيل الملف
        run: |
          URL="${{ inputs.file_url }}"
          EXT="${URL##*.}"
          EXT="${EXT%%\?*}"
          if [ -z "$EXT" ] || [ ${#EXT} -gt 5 ]; then
            EXT="mp4"
          fi
          OUTPUT="record_$(date +%Y%m%d_%H%M%S).$EXT"

          curl -L -o "$OUTPUT" "$URL"

          if [ ! -s "$OUTPUT" ]; then
            echo "فشل التنزيل (حجم الملف صفر)"
            exit 1
          fi

          echo "output_file=$OUTPUT" >> $GITHUB_ENV
          echo "size_mb=$(du -m "$OUTPUT" | cut -f1)" >> $GITHUB_ENV

      - name: رفع إلى Internet Archive
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          python - <<EOF
          from internetarchive import upload
          import os
          from datetime import date

          identifier = "record-\( (date +%Y%m%d-%H%M%S)- \){GITHUB_RUN_ID}"
          file_path = "${{ env.output_file }}"

          title = "${{ inputs.title }}" or "تسجيل تلقائي - $(date +%Y-%m-%d)"

          metadata = {
              'title': title,
              'description': f'تنزيل ملف عادي ثم رفعه',
              'mediatype': 'movies',
              'collection': 'opensource_movies',
              'subject': 'video;download;recording'
          }

          print(f"برفع بمعرف: {identifier}")

          r = upload(identifier, files=[file_path], metadata=metadata, access_key=os.environ['S3_ACCESS_KEY'], secret_key=os.environ['S3_SECRET_KEY'])

          if r[0].status_code == 200:
              print("رفعت المتعة بنجاح يا ولدي 💦")
          else:
              print("فشل الرفع:", r[0].status_code, r[0].text)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"identifier={identifier}\\n")
          EOF

      - name: عرض النتيجة النهائية
        if: always()
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "الحجم : ${{ env.size_mb }} MB"
          echo "المدة : ${{ inputs.duration_minutes }} دقيقة"
          echo "المعرف : ${{ env.identifier }}"
          echo "رابط العرض : https://archive.org/details/${{ env.identifier }}"
          echo "رابط التحميل : https://archive.org/download/\( {{ env.identifier }}/ \){{ env.output_file }}"
          echo "══════════════════════════════════════════════════════"
          echo ""
          echo "ملاحظة: الملفات الطويلة قد تواجه مشاكل في الاستقرار"
          echo "وقد يستغرق ظهور الفيديو كاملاً 10–60 دقيقة بعد الرفع"